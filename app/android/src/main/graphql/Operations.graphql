# What the app asks the news server (news-server-core-go). The schema next to it is the server's, copied by
# ./gradlew :app:android:syncServerSchema.

# --- Enrollment (no certificate yet: @public) ---------------------------------------------------------------------

query EnrollmentPreview($code: String!) {
  enrollmentPreview(code: $code) {
    __typename
    ... on EnrollmentPreview {
      user
      expiresAt
    }
    ... on EnrollmentRejected {
      reason
    }
  }
}

mutation EnrollDevice($input: EnrollDeviceInput!) {
  enrollDevice(input: $input) {
    ...Enrollment
  }
}

# A new certificate for a new key, asked with the current one in its last 30 days.
mutation RenewCertificate($csr: String!, $keyProtection: KeyProtection!) {
  renewCertificate(csr: $csr, keyProtection: $keyProtection) {
    ...Enrollment
  }
}

fragment Enrollment on EnrollDeviceResult {
  __typename
  ... on EnrolledDevice {
    user
    deviceName
    certificate
    serial
    expiresAt
  }
  ... on EnrollmentRejected {
    reason
  }
}

# --- With the client certificate ----------------------------------------------------------------------------------

query ServerInfo {
  serverInfo {
    api
    version
    renewCertificates
    stories
    summaries
    discovery {
      fingerprint
      id
      key
      addresses
    }
  }
}

query Headlines($since: Time, $sourceIds: [String!]) {
  headlines(since: $since, sourceIds: $sourceIds) {
    ...ServerHeadline
  }
}

query Articles($urls: [String!]!) {
  articles(urls: $urls) {
    ...ServerArticle
  }
}

query Stories {
  stories {
    groupedAt
    stories {
      reports {
        url
      }
      summary {
        ...ServerStorySummary
        threads {
          ...ServerThreadRef
        }
      }
    }
  }
}

# Stories with what each version added and the kind of each added sentence: the what's new on cards and pages. A server
# from before kinds refuses it, and the app asks StoriesWithUpdates, then Stories ([ApolloServerApi.stories]).
query StoriesWithKinds {
  stories {
    groupedAt
    stories {
      reports {
        url
      }
      summary {
        ...ServerStorySummary
        threads {
          ...ServerThreadRef
        }
        updates {
          ...ServerStoryUpdate
          kinds
        }
      }
    }
  }
}

query StoriesWithUpdates {
  stories {
    groupedAt
    stories {
      reports {
        url
      }
      summary {
        ...ServerStorySummary
        threads {
          ...ServerThreadRef
        }
        updates {
          ...ServerStoryUpdate
        }
      }
    }
  }
}

fragment ServerStoryUpdate on StoryUpdate {
  at
  sentences {
    ...ServerSentence
  }
}

# Every version of a story, newest first.
query StoryVersions($id: ID!) {
  storyVersions(id: $id) {
    ...ServerStorySummary
  }
}

fragment ServerStorySummary on StorySummary {
  title
  sentences {
    ...ServerSentence
  }
  contradictions {
    ...ServerSentence
  }
  unrelated
  reports
  headlineOnly
  writtenAt
  writtenWith {
    fullArticles
    length
  }
  id
  version
  versions
  current
}

# A thread as a story's card or a related thread names it.
fragment ServerThreadRef on Thread {
  id
  name
  storyCount
  startedAt
  updatedAt
}

# One thread with its stories and related threads: its page, asked for when it opens.
query Thread($id: ID!) {
  thread(id: $id) {
    ...ServerThreadRef
    summary
    stories {
      id
      title
      sentences {
        ...ServerSentence
      }
      firstWrittenAt
      writtenAt
      firstReportAt
      lastReportAt
    }
    related {
      ...ServerThreadRef
    }
  }
}

fragment ServerSentence on Sentence {
  text
  footnotes {
    url
    sourceId
    title
    video
    publishedAt
  }
  topic
  sides {
    value
    footnotes {
      url
      sourceId
      title
      video
      publishedAt
    }
  }
}

fragment ServerHeadline on Headline {
  sourceId
  url
  title
  summary
  imageUrl
  publishedAt
  category
  subtitle
  video
  firstSeen
  lastSeen
}

fragment ServerArticle on Article {
  sourceId
  url
  title
  subtitle
  author
  publishedAt
  imageUrl
  category
  body
  blocks {
    type
    text
    url
    caption
  }
  video {
    poster
    stream
    embed
    duration
  }
}

# The sites the server reads and its settings for each (Settings › אתרים, with the server on).
query Sources {
  sources {
    ...ServerSourceFields
  }
}

# One site's settings on the server; the fields left out keep their value.
mutation SetSource($id: String!, $enabled: Boolean, $feed: Boolean, $waitMs: Int) {
  setSource(id: $id, enabled: $enabled, feed: $feed, waitMs: $waitMs) {
    ...ServerSourceFields
  }
}

fragment ServerSourceFields on Source {
  id
  name
  baseUrl
  language
  enabled
  hasFeed
  feed
  waitMs
  hidden
}

# Hides a site from this user's feed or shows it again: their choice, on the server for all their devices.
mutation SetSourceHidden($id: String!, $hidden: Boolean!) {
  setSourceHidden(id: $id, hidden: $hidden) {
    ...ServerSourceFields
  }
}

# What the server has done (Settings › שרת החדשות › סטטיסטיקה).
query Stats {
  stats {
    headlines
    articles
    stories
    groupedAt
    summaries
    gemini {
      model
      budget
      today
      days {
        day
        requests
        tokensIn
        tokensCached
        tokensOut
        tokensThinking
      }
      lastRun {
        at
        written
        waiting
        error
      }
    }
    lastLoop {
      startedAt
      everyMinutes
      readSeconds
      headlines
      newArticles
      failedSites
      groupSeconds
      summarySeconds
      totalSeconds
    }
    sites {
      sourceId
      enabled
      lastRunAt
      lastOkAt
      headlines
      error
    }
  }
}

# How the server groups stories (Settings › סיפורים, with the server on).
query Grouping {
  grouping {
    ...ServerGroupingFields
  }
}

mutation SetGrouping($strictness: Int, $text: StoryText, $days: Int, $method: GroupingMethod) {
  setGrouping(strictness: $strictness, text: $text, days: $days, method: $method) {
    ...ServerGroupingFields
  }
}

fragment ServerGroupingFields on Grouping {
  method
  geminiAvailable
  model
  text
  strictness
  days
  threshold
}

# How the summaries are written (Settings › סיפורים): whether Gemini reads the full articles; null with summaries off.
query SummarySettings {
  summarySettings {
    fullArticles
    length
    rewriteMinutes
    rewriteOnNewSite
    reserveAfter
  }
}

mutation SetSummarySettings($fullArticles: Boolean, $length: StoryLength, $rewriteMinutes: Int, $rewriteOnNewSite: Boolean, $reserveAfter: Int) {
  setSummarySettings(fullArticles: $fullArticles, length: $length, rewriteMinutes: $rewriteMinutes, rewriteOnNewSite: $rewriteOnNewSite, reserveAfter: $reserveAfter) {
    fullArticles
    length
    rewriteMinutes
    rewriteOnNewSite
    reserveAfter
  }
}

# The threads, latest updated first: the threads list (the bottom bar's ⏱).
query Threads($first: Int) {
  threads(first: $first) {
    ...ServerThreadRef
    summary
  }
}

# Every thread with its stories (no footnotes) and related threads: the threads map, asked for when it opens.
query ThreadsMap($first: Int) {
  threads(first: $first) {
    ...ServerThreadRef
    summary
    related {
      id
    }
    stories {
      id
      title
      firstWrittenAt
      writtenAt
      firstReportAt
      lastReportAt
      sentences {
        text
      }
    }
  }
}

# --- Users and roles -----------------------------------------------------------------------------------------------

# Who this device is: its user, their role (an admin changes the server's settings) and the device's name.
query Me {
  me {
    user
    role
    deviceName
  }
}

# The read marks this user made, on any of their devices, since a time (all when omitted).
query ReadArticles($since: Time) {
  readArticles(since: $since) {
    url
    readAt
  }
}

# Marks articles read for this user on all their devices (at most 500 at once).
mutation MarkRead($urls: [String!]!) {
  markRead(urls: $urls)
}

# Admins only (FORBIDDEN to others): the users and their devices, invites, roles, revoking and removing.
query Users {
  users {
    ...ServerUser
  }
}

fragment ServerUser on User {
  name
  role
  devices {
    serial
    name
    keyProtection
    registeredAt
    expiresAt
    revokedAt
    current
  }
}

mutation CreateInvite($user: String!, $role: Role) {
  createInvite(user: $user, role: $role) {
    code
    user
    role
    expiresAt
    link
  }
}

mutation SetUserRole($user: String!, $role: Role!) {
  setUserRole(user: $user, role: $role) {
    ...ServerUser
  }
}

mutation RevokeDevice($serial: String!) {
  revokeDevice(serial: $serial) {
    serial
    revokedAt
  }
}

mutation RemoveUser($user: String!) {
  removeUser(user: $user)
}

# --- Video ---------------------------------------------------------------------------------------------------------

# An article's video, played through the server: a path on it (HLS or MP4), or null (then the embed in a web view).
query VideoStream($url: String!) {
  videoStream(url: $url) {
    path
    hls
  }
}

# --- Following ----------------------------------------------------------------------------------------------------

# The stories this user follows, each with its short updates since: its own new facts and its threads' new stories.
query Following {
  following {
    id
    title
    followedAt
    threads {
      ...ServerThreadRef
    }
    updates {
      at
      storyId
      storyTitle
      newStory
      sentences {
        ...ServerSentence
      }
      kinds
    }
  }
}

mutation FollowStory($id: ID!, $follow: Boolean!) {
  followStory(id: $id, follow: $follow)
}
